name: flightops
version: "0.1.0"
profile: flightops
config-version: 2

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  lake: "r2://{{ env_var('R2_BUCKET', 'flight-ops-lake') }}"

models:
  flightops:
    staging:
      +materialized: view
    gold:
      +materialized: external
