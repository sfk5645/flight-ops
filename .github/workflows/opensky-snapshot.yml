name: opensky-snapshot

# Every 5 minutes (GitHub's shortest schedule; runs can start late or be skipped when GitHub
# is busy). ~1,150 of the 4,000 daily OpenSky credits. Raw snapshots expire after 2 days.
# Offset to :03, :08, :13... because runs on the exact :00/:05 marks are the most often delayed.
on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

# If a run is still going when the next one starts, let it finish and drop the queued one,
# so runs never pile up.
concurrency:
  group: opensky-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Store one snapshot in bronze
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: uv run python -m flightops.flows.opensky_snapshot
