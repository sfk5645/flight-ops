name: opensky-snapshot

# Started every 5 minutes by an external timer (cron-job.org) calling the workflow_dispatch
# API, because GitHub's own schedule fired once in 16 hours when we tried it. Setup steps are
# in docs/setup.md. ~1,150 of the 4,000 daily OpenSky credits. Raw snapshots expire after 2 days.
on:
  workflow_dispatch:

# If a run is still going when the next one starts, the new one waits, so runs never overlap.
concurrency:
  group: opensky-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Store one snapshot in bronze
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: uv run python -m flightops.flows.opensky_snapshot
