name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --format requirements-txt --no-emit-project --quiet > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"

      # Compiles every dbt model and test without touching R2 (dummy credentials).
      - name: dbt parse
        env:
          R2_ACCOUNT_ID: ci
          R2_ACCESS_KEY_ID: ci
          R2_SECRET_ACCESS_KEY: ci
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt
