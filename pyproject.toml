[project]
name = "flightops"
version = "0.1.0"
description = "Flight delay prediction (US) and anomaly detection (worldwide) on free-tier infrastructure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.36",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "timezonefinder>=9.2.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.36",
    "moto[s3]>=5.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
